{% extends 'base.html' %}

{% block head %}
<title>Login</title>
{% endblock %}


{% block body %}
<form class="form" autocomplete="off" action='/refereeMatchChoice?tournamentName={{ parametersList[0] }}&refereePassword={{ parametersList[1] }}' method="POST" >
  <div class="control">
    <h1> {{ parametersList[0] }}</h1>
  </div>
  
  {% if error %}
      <p style="color: red;">{{ error }}</p>
  {% endif %}

  {% for k in matchesList %}
  <button class="btn block-cube block-cube-hover refereeMatchButton" type="submit" name="matchIdButton" value="{{k[0]}}">
    <div class="bg-top"><div class="bg-inner"></div></div>
    <div class="bg-right"><div class="bg-inner"></div></div>
    <div class="bg"><div class="bg-inner"></div></div>
    <span class="text monoline">Match n°{{k[0]}}</span>
    <span class="text monoline">{{k[1]}}</span>
    <span class="text monoline">{{k[2]}}</span>
    <span class="text monoline">{{k[3]}}</span>
    <span class="text monoline">{{k[4]}}</span>
  </button>
  {% endfor %}

</form>
{% endblock %}
